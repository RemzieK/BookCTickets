<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{https://fonts.googleapis.com/icon?family=Material+Icons}" rel="stylesheet">
    <link th:href="@{https://fonts.googleapis.com/css?family=Oswald:300,400,700}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/book.css}">
    <title>Book Seats</title>
</head>
<body>

<a th:href="@{/index}" class="logo">
    <img th:src="@{/assets/logo-w.png}" alt="" class="logo-img">
</a>

<div id="booking-root"
     th:data-movie-id="${movie.id}"
     th:data-price-per-seat="${movie.ticketPrice}">

    <div class="booking-container">
        <h1 th:text="'Select seats for ' + ${movie.title}">Select the seats</h1>

        <h2>Select Date:</h2>
        <input type="date" id="date-input" class="date-input">

        <h2>Select Time:</h2>
        <div class="hour-buttons">
            <button th:each="h : ${hours}" type="button" class="hour-btn"
                    th:text="${h}" th:data-hour="${h}"></button>
        </div>

        <div id="cinema-container">
            <div class="side-seats">
                <table class="seats">
                    <thead><tr></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="center-seats">
                <table class="seats">
                    <thead><tr></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="side-seats">
                <table class="seats">
                    <thead><tr></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="screen"><span>SCREEN</span></div>

        <div class="container">
            <button id="reserve-btn" class="reserve-btn">Reserve Seats</button>
            <button id="pay-held-btn" class="reserve-btn" style="display:none">Continue to payment</button>
            <div id="result">
                <p id="selected-seats"></p>
                <p id="total-price"></p>
            </div>
        </div>

        <div id="reservationModal" class="payment-modal">
            <div class="payment-modal-content">
                <span id="closeReservationModal" class="close-btn">&times;</span>
                <h2>Seats temporary reserved!</h2>
                <p>Complete payment within 10 minutes.</p>
                <button id="goToPaymentBtn" class="pay-btn">Buy tickets</button>
            </div>
        </div>

        <div id="paymentModal" class="payment-modal">
            <div class="payment-modal-content">
                <span id="closeModal" class="close-btn">&times;</span>

                <h2>Payment Information</h2>
                <input type="text" name="cardName" placeholder="Name on Card" required>
                <input type="text" name="cardNumber" placeholder="Card Number" required>
                <input type="text" name="expiry" placeholder="MM/YY" required>
                <input type="text" name="cvc" placeholder="CVC" required>

                <button id="buy-btn" type="button" class="pay-btn">Pay Now</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/book.js}"></script>
</body>
</html>
