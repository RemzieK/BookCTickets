<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{https://fonts.googleapis.com/icon?family=Material+Icons}" rel="stylesheet">
    <link th:href="@{https://fonts.googleapis.com/css?family=Oswald:300,400,700}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/book.css}">
    <title>Book Seats</title>
</head>
<body>

<div id="booking-root"
     th:data-movie-id="${movie.id}"
     th:data-price-per-seat="${movie.ticketPrice}">

    <h1 th:text="'Select seats for ' + ${movie.title}">Select the seats</h1>

    <h4>Select Time:</h4>
    <div class="mb-3">
        <button th:each="h : ${hours}" type="button" class="btn hour-btn"
                th:text="${h}" th:data-hour="${h}"></button>
    </div>

    <div class="screen">
        <span>SCREEN</span>
    </div>

    <div id="cinema-container">
        <div class="side-seats">
            <table class="seats">
                <thead><tr></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="center-seats">
            <table class="seats">
                <thead><tr></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="side-seats">
            <table class="seats">
                <thead><tr></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="container">
        <button id="show-seats" type="button">Show Selection</button>
        <button id="reserve-btn" type="button" style="display:none;">Reserve Seats</button>

        <div id="result">
            <p id="selected-seats"></p>
            <p id="total-price"></p>
        </div>
    </div>

    <div id="paymentSection" style="display:none;">
        <h4>Payment Information</h4>
        <input type="text" name="cardName" placeholder="Name on Card" required>
        <input type="text" name="cardNumber" placeholder="Card Number" required>
        <input type="text" name="expiry" placeholder="MM/YY" required>
        <input type="text" name="cvc" placeholder="CVC" required>
        <button id="buy-btn" type="button">Pay Now</button>
    </div>

</div>

<script th:src="@{/js/book.js}"></script>
</body>
</html>
