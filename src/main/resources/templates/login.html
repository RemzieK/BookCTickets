<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <style>
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-left">
            <img th:src="@{/assets/logo.png}" alt="Logo" class="logo">
            <h2>Log in</h2>
            <p>Please login to your account</p>

            <form th:action="@{/login}" method="post">
                <input type="text" name="username" placeholder="Username" required>

                <div class="password-container">
                    <input type="password" name="password" id="loginPassword" placeholder="Password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">👁️</button>
                </div>

                <button type="submit" class="btn-login">LOG IN</button>
                <a href="#" class="forgot">Forgot password?</a>
            </form>

            <div class="signup">
                <span>Don't have an account?</span>
                <a href="/register" class="btn-create">CREATE NEW</a>
            </div>
        </div>

        <div class="login-right">
            <h2>BookCTickets</h2>
            <p>Sign in into your account to book tickets, for the newest showtimes today with exclusive offers.</p>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "🙈";
        } else {
            input.type = "password";
            btn.textContent = "👁️";
        }
    }
</script>
</body>
</html>
