<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <title>BookCTickets - Movies</title>

    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Additional CSS Files -->
    <link th:href="@{/css/fontawesome.css}" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css"/>
</head>

<body>

<!-- ***** Preloader Start ***** -->
<div id="js-preloader" class="js-preloader">
    <div class="preloader-inner">
        <span class="dot"></span>
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</div>
<!-- ***** Preloader End ***** -->

<!-- ***** Header Area Start ***** -->
<header class="header-area header-sticky">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <nav class="main-nav">
                    <a th:href="@{/index}" class="logo">
                        <img th:src="@{/assets/logo-w.png}" alt="logo" style="width: 158px;">
                    </a>
                    <ul class="nav">
                        <li><a th:href="@{/index}">Home</a></li>
                        <li><a th:href="@{/movies}" class="active">Movies</a></li>
                        <li><a th:href="@{/about}">About Us</a></li>
                        <li><a th:href="@{/login}">Sign In</a></li>
                    </ul>
                    <a class='menu-trigger'>
                        <span>Menu</span>
                    </a>
                </nav>
            </div>
        </div>
    </div>
</header>
<!-- ***** Header Area End ***** -->

<div class="page-heading header-text">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <h3>Movies</h3>
                <span class="breadcrumb"><a th:href="@{/index}">Home</a> > Movies</span>
            </div>
        </div>
    </div>
</div>

<div class="section trending">
    <div class="container">
        <ul class="trending-filter">
            <li><a class="is_active" href="#!" data-filter="*">Show All</a></li>
            <li><a href="#!" data-filter=".adventure">Adventure</a></li>
            <li><a href="#!" data-filter=".romance">Romance</a></li>
            <li><a href="#!" data-filter=".action">Action</a></li>
        </ul>

        <div class="row trending-box">
            <!-- Movies Loop -->
            <div class="col-lg-3 col-md-6 mb-30 trending-items" th:each="movie : ${movies}" th:classappend="${movie.genre.toLowerCase()}">
                <div class="item">
                    <div class="thumb">
                        <img th:src="@{${movie.imageUrl}}" alt="Movie Image" class="img-fluid movie-img">
                        <span class="price" th:text="'$' + ${movie.ticketPrice}"></span>
                    </div>
                    <div class="down-content">
                        <span class="category" th:text="${movie.genre}">Genre</span>
                        <h4 th:text="${movie.title}">Movie Title</h4>
                        <button class="btn btn-primary mt-2"
                                data-bs-toggle="modal"
                                th:attr="data-bs-target=${'#movieModal' + movie.id}">
                            View Details
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Movie Modals -->
<div th:each="movie : ${movies}">
    <div class="modal fade" th:id="${'movieModal' + movie.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="${movie.title}">Movie Title</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-5">
                            <img th:src="@{${movie.imageUrl}}" class="img-fluid movie-img" alt="Movie Image">
                        </div>
                        <div class="col-md-7">
                            <p><strong>Description:</strong> <span th:text="${movie.description}"></span></p>
                            <p><strong>Actors:</strong> <span th:text="${movie.actors}"></span></p>
                            <p><strong>Hours:</strong> <span th:text="${movie.hours}"></span></p>
                            <p><strong>Room:</strong> <span th:text="${movie.room}"></span></p>
                            <p><strong>Language:</strong> <span th:text="${movie.language}"></span></p>
                            <p><strong>Age Restriction:</strong> <span th:text="${movie.ageRestriction}"></span></p>
                            <p><strong>Price:</strong> $<span th:text="${movie.ticketPrice}"></span></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <a th:href="@{'/book/' + ${movie.id}}" class="btn btn-success">Book a Ticket</a>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="container">
        <div class="col-lg-12">
            <p>Copyright © 2025 BookCTickets. All rights reserved.</p>
        </div>
    </div>
</footer>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.min.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/isotope.min.js}"></script>
<script th:src="@{/js/owl-carousel.js}"></script>
<script th:src="@{/js/counter.js}"></script>
<script th:src="@{/js/custom.js}"></script>

</body>
</html>
