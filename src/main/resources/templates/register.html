<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/register.css}" />
    <style>
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-card">
        <div class="register-left">
            <img th:src="@{/assets/logo.png}" alt="Logo" class="logo">
            <h2>Register</h2>
            <p>Please register to continue</p>

            <form th:action="@{/register}" method="post" th:object="${user}">
                <input type="text" th:field="*{username}" placeholder="Username" required>
                <input type="text" th:field="*{firstName}" placeholder="First Name" required>
                <input type="text" th:field="*{lastName}" placeholder="Last Name" required>
                <input type="email" th:field="*{email}" placeholder="Email" required>

                <div class="password-container">
                    <input type="password" th:field="*{password}" id="registerPassword" placeholder="Password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('registerPassword', this)">👁️</button>
                </div>

                <button type="submit" class="btn-register">REGISTER</button>
            </form>

            <div class="signup">
                <span>Already have an account?</span>
                <a href="/login" class="btn-create">LOG IN</a>
            </div>
        </div>

        <div class="register-right">
            <div class="right-content">
                <h2>BookCTickets</h2>
                <p>Create your free account to book your movie ticket right now with exclusive offers and instant access to the latest showtimes.</p>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            btn.textContent = "🙈";
        } else {
            input.type = "password";
            btn.textContent = "👁️";
        }
    }
</script>
</body>
</html>
